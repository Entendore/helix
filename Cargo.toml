[workspace]
resolver = "2"
members = [
    "crates/helix-core",
    "crates/helix-ecs",
    "crates/helix-assets",
    "crates/helix-scene",
    "crates/helix-sim",
    "crates/helix-render",
    "crates/helix-app",
    "crates/helix-testkit",
]

[workspace.dependencies]
glam     = { version = "0.29", features = ["bytemuck"] }
bytemuck = { version = "1.16", features = ["derive"] }
serde    = { version = "1", features = ["derive"] }
ron      = "0.8"
log      = "0.4"
bincode  = "1.3"
winit    = "0.30"
wgpu     = "22"
pollster = "0.4"

[profile.release]
# FDET-1: stock release profile — no fast-math, ever.
